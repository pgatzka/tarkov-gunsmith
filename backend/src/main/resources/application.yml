spring:
  application:
    name: tarkov-gunsmith
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gunsmith}
    username: ${DB_USER:gunsmith}
    password: ${DB_PASSWORD:gunsmith}
  flyway:
    locations: classpath:db/migration

server:
  servlet:
    # Everything (REST API and Actuator) lives under /api, so nginx and the Vite
    # dev server can proxy /api/* to the backend unchanged.
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

gunsmith:
  tarkov-dev:
    base-url: https://json.tarkov.dev
  sync:
    # Pull json.tarkov.dev on startup and then every interval (its data updates about every 10 min).
    enabled: true
    interval: 10m
  game-data:
    # Launchers and other special weapons get no builds (SPEC §1.1). Ids are json.tarkov.dev ids.
    excluded-weapon-categories:
      - 5447bedf4bdc2d87278b4568 # Grenade launcher (incl. signal pistols and RSP/ROP flare cartridges)
      - 67446d4f04141c10630604e7 # Rocket launcher
    excluded-weapons:
      - 6275303a9f372d6ea97f9ec7 # Milkor M32A1 MSGL, filed under Revolver
