spring:
  application:
    name: tarkov-gunsmith
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gunsmith}
    username: ${DB_USER:gunsmith}
    password: ${DB_PASSWORD:gunsmith}
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
